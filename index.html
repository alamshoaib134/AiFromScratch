<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI From Scratch | 30-Day Challenge</title>
    
    <!-- Elegant Font Pairing: Playfair Display (Serif) & Lato (Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- Phosphor Icons (Light weight for elegance) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Lato', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        // Custom warm stone palette for editorial feel
                        theme: {
                            bg: '#FAF9F6', // Off-white alabaster
                            surface: '#FFFFFF',
                            border: '#E7E5E4', // stone-200
                            muted: '#A8A29E',  // stone-400
                            text: '#44403C',   // stone-700
                            heading: '#1C1917',// stone-900
                            accent: '#292524', // stone-800
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FAF9F6;
            color: #44403C;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Minimalist Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #D6D3D1; /* stone-300 */
        }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb {
            background-color: #A8A29E;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Elegant button hover effect */
        .btn-elegant {
            position: relative;
            overflow: hidden;
        }
        .btn-elegant::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: currentColor;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .btn-elegant:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }
    </style>
</head>

<body class="h-screen flex flex-col font-sans selection:bg-stone-200 selection:text-stone-900">

    <!-- Top Navbar (Clean, crisp, white) -->
    <header class="bg-white border-b border-theme-border sticky top-0 z-40 w-full h-[72px] flex items-center justify-between px-4 sm:px-8 shrink-0">
        <div class="flex items-center gap-4">
            <button id="mobile-menu-btn" class="lg:hidden text-theme-muted hover:text-theme-heading focus:outline-none p-2 -ml-2 transition-colors">
                <i class="ph ph-list text-2xl"></i>
            </button>
            <div class="flex items-center gap-3">
                <h1 class="font-serif font-semibold text-2xl tracking-tight text-theme-heading">
                    AI <span class="font-light italic text-stone-500">From Scratch</span>
                </h1>
            </div>
        </div>

        <div class="flex items-center gap-6 w-1/2 max-w-sm">
            <div class="flex-1 hidden sm:block">
                <div class="flex justify-between text-[10px] font-sans font-bold text-theme-muted mb-1.5 uppercase tracking-widest">
                    <span>Course Progress</span>
                    <span id="progress-text" class="text-theme-heading">0%</span>
                </div>
                <div class="w-full bg-stone-100 h-1 overflow-hidden">
                    <div id="progress-bar" class="bg-theme-heading h-1 transition-all duration-700 ease-out" style="width: 0%"></div>
                </div>
            </div>
            <button id="reset-btn" class="text-xs font-sans font-bold uppercase tracking-widest text-theme-muted hover:text-red-800 transition-colors flex items-center gap-1.5" title="Reset Progress">
                <i class="ph ph-arrow-counter-clockwise text-lg"></i>
                <span class="hidden sm:inline btn-elegant">Reset</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative bg-theme-bg">
        <!-- Sidebar Overlay for mobile -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-stone-900/20 z-20 hidden lg:hidden backdrop-blur-sm transition-opacity opacity-0"></div>

        <!-- Sidebar Navigation (Minimalist) -->
        <aside id="sidebar" class="absolute inset-y-0 left-0 z-30 w-72 bg-theme-bg border-r border-theme-border transform -translate-x-full lg:relative lg:translate-x-0 transition-transform duration-400 ease-in-out flex flex-col shadow-2xl lg:shadow-none">
            <div class="p-6 border-b border-theme-border shrink-0 flex justify-between items-center lg:hidden bg-white">
                <span class="font-serif font-semibold text-theme-heading text-lg">Menu</span>
                <button id="close-sidebar-btn" class="text-theme-muted hover:text-theme-heading transition-colors">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>
            <nav id="course-nav" class="flex-1 overflow-y-auto custom-scrollbar p-6 space-y-8 pb-20">
                <!-- Navigation items injected by JS -->
            </nav>
        </aside>

        <!-- Main Content Area (Editorial Style) -->
        <main id="main-content" class="flex-1 overflow-y-auto relative w-full custom-scrollbar scroll-smooth">
            <div class="max-w-3xl mx-auto px-4 sm:px-8 lg:px-12 py-10 lg:py-16 min-h-full flex flex-col">
                
                <!-- Breadcrumb -->
                <div id="breadcrumb" class="text-[11px] font-sans font-bold tracking-widest uppercase text-theme-muted mb-8 flex items-center gap-3 fade-in">
                    <span id="bc-chapter" class="text-stone-500">Chapter 1</span>
                    <span class="w-8 h-px bg-theme-border"></span>
                    <span id="bc-day" class="text-theme-heading">Day 1</span>
                </div>

                <!-- Content Article -->
                <article class="fade-in flex-1">
                    
                    <!-- Title & Status -->
                    <div class="mb-10">
                        <h2 id="content-title" class="text-4xl sm:text-5xl font-serif font-semibold text-theme-heading leading-tight mb-6">
                            Loading module...
                        </h2>
                        <div id="status-badge" class="hidden inline-flex items-center gap-2 px-3 py-1 bg-stone-100 border border-stone-200 text-xs font-sans font-bold uppercase tracking-widest text-stone-600">
                            <i class="ph ph-check text-base"></i> Completed
                        </div>
                    </div>
                    
                    <!-- Prose configuration for classic editorial look -->
                    <div id="content-body" class="prose prose-stone prose-lg max-w-none 
                        prose-headings:font-serif prose-headings:font-semibold prose-headings:text-theme-heading 
                        prose-p:text-theme-text prose-p:leading-relaxed prose-p:font-light
                        prose-a:text-stone-800 prose-a:font-normal prose-a:decoration-stone-300 hover:prose-a:decoration-stone-800 hover:prose-a:text-black transition-colors
                        prose-strong:font-bold prose-strong:text-theme-heading
                        prose-blockquote:font-serif prose-blockquote:font-light prose-blockquote:italic prose-blockquote:border-stone-800 prose-blockquote:text-stone-600

                        <!-- Dynamic content goes here -->
                    </div>

                    <!-- Action Area -->
                    <div class="mt-20 pt-10 border-t border-theme-border flex flex-col sm:flex-row items-center justify-between gap-6">
                        
                        <button id="mark-complete-btn" class="w-full sm:w-auto px-8 py-4 border border-theme-heading text-theme-heading font-sans font-bold uppercase tracking-widest text-xs hover:bg-stone-50 transition-colors flex items-center justify-center gap-3">
                            <i class="ph ph-circle text-lg"></i>
                            <span>Mark as Complete</span>
                        </button>

                        <div class="flex w-full sm:w-auto gap-4">
                            <button id="prev-btn" class="flex-1 sm:flex-none p-4 border border-transparent text-theme-muted hover:text-theme-heading transition-colors flex items-center justify-center disabled:opacity-30 disabled:cursor-not-allowed">
                                <i class="ph ph-arrow-left text-xl"></i>
                            </button>
                            <button id="next-btn" class="flex-1 sm:flex-none px-8 py-4 bg-theme-heading text-white font-sans font-bold uppercase tracking-widest text-xs hover:bg-black transition-colors flex items-center justify-center gap-3 disabled:opacity-30 disabled:cursor-not-allowed">

                <footer class="mt-24 text-center">

        </main>
    </div>

    <!-- Custom Reset Modal -->
    <div id="reset-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white border border-theme-border p-8 sm:p-10 shadow-2xl max-w-md w-full mx-4 transform scale-95 transition-transform duration-300" id="reset-modal-content">
            <h3 class="text-2xl font-serif font-semibold text-theme-heading mb-4">Reset Progress</h3>
            <p class="text-theme-text font-light leading-relaxed mb-10">You are about to erase all completed days and return to the beginning of the curriculum. This action cannot be undone.</p>
            <div class="flex gap-4">
                <button id="modal-cancel-btn" class="flex-1 py-3 px-4 border border-stone-300 font-sans font-bold uppercase tracking-widest text-xs text-stone-600 hover:bg-stone-50 transition-colors">Cancel</button>
                <button id="modal-confirm-btn" class="flex-1 py-3 px-4 bg-red-800 text-white font-sans font-bold uppercase tracking-widest text-xs hover:bg-red-900 transition-colors">Confirm Reset</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. DATA STRUCTURE ---
        const courseData = [
            {
                chapterTitle: "Chapter 1: Foundations",
                chapterDesc: "The core mechanics of how machines process language.",
                days: [
                    {
                        day: 1,
                        title: "NLP (Natural Language Processing)",
                        concept: "The bridge between human words and computer code.",
                        content: `<p>Before AI can think, it has to understand us. NLP is the branch of computer science that deals with giving computers the ability to understand text and spoken words in much the same way human beings can.</p>
                        <h3>Why does it matter?</h3>
                        <p>Without NLP, computers only understand 1s and 0s. NLP allows us to command complex systems using conversational English.</p>`
                    },
                    {
                        day: 2,
                        title: "Tokenization",
                        concept: "Chopping text into puzzle pieces.",
                        content: `<p>AI doesn't read full words the way we do. Instead, it breaks text down into smaller chunks called "tokens." A token might be a single character, a syllable, or a whole word.</p>
                        <blockquote>
                            <strong>Example:</strong> The word "Hamburger" might be split into three tokens: <code>Ham</code>, <code>bur</code>, <code>ger</code>.
                        </blockquote>
                        <p>By turning words into these standardized puzzle pieces, the AI can begin to process them mathematically.</p>`
                    },
                    {
                        day: 3,
                        title: "Text Embeddings",
                        concept: "Turning words into math.",
                        content: `<p>How does a computer know that an apple is related to an orange, but not to a submarine? Embeddings convert tokens into long lists of numbers (coordinates).</p>
                        <p>Similar concepts are placed close together on a massive digital map, allowing the AI to understand relationships and context. "King" and "Queen" live in the same neighborhood; "Car" lives far away.</p>`
                    },
                    {
                        day: 4,
                        title: "The Attention Mechanism",
                        concept: "Reading the room.",
                        content: `<p>Older AI forgot what happened at the beginning of a sentence by the time it reached the end. The "Attention Mechanism" was a massive breakthrough (introduced in the famous "Transformers" architecture in 2017).</p>
                        <p>It lets AI look at a whole sentence at once, weighing the importance of every word against every other word to truly understand context.</p>`
                    },
                    {
                        day: 5,
                        title: "The Knowledge Cutoff & Hallucinations",
                        concept: "The confident guesser.",
                        content: `<p>An AI model is a frozen snapshot of the internet up to the day its training stopped (the knowledge cutoff).</p>
                        <p>Because it operates by predicting the next most likely word based on patterns, if it doesn't know a fact, it will use math to confidently invent a plausible-sounding lie. This is called a <strong>hallucination</strong>.</p>`
                    },
                    {
                        day: 6,
                        title: "RAG (Retrieval-Augmented Generation)",
                        concept: "The open-book test.",
                        content: `<p>To fix hallucinations and outdated information, engineers created RAG. Instead of relying solely on its frozen memory, the AI is given the ability to search a private database or the live internet for facts <em>before</em> it answers you.</p>
                        <p>It reads the retrieved documents and uses them to generate a factual, grounded response.</p>`
                    },
                    {
                        day: 7,
                        title: "Vector Databases",
                        concept: "Smart filing cabinets.",
                        content: `<p>If RAG is the open-book test, the Vector Database is the library. It stores your company data, PDFs, and notes as mathematical concepts (vectors) rather than just text.</p>
                        <p>This allows the AI to search through millions of documents in milliseconds to find concepts that are <em>semantically</em> related to your question, even if exact keywords aren't used.</p>`
                    }
                ]
            },
            {
                chapterTitle: "Chapter 2: Search & Context",
                chapterDesc: "How AI finds the right information and applies it.",
                days: [
                    { day: 8, title: "Semantic Search", concept: "Searching by meaning.", content: "<p>Traditional search requires you to type exact keywords. Semantic search uses embeddings (from Day 3) to search by meaning. If you search for 'automobile,' a semantic search engine knows to bring up documents about 'cars' and 'vehicles,' even if the word 'automobile' is never used.</p>" },
                    { day: 9, title: "Prompt Augmentation", concept: "The invisible context.", content: "<p>When you use a RAG system, the AI doesn't just see your short prompt. Behind the scenes, the system fetches relevant facts from the vector database and secretly stitches them into your prompt. The AI actually reads a massive document of context before it even begins to reply to your question.</p>" },
                    { day: 10, title: "RAG vs. Fine-Tuning", concept: "Facts vs. Behavior.", content: "<p>A common point of confusion is how to teach an AI. Use <strong>RAG</strong> when you want to teach the AI new <em>facts</em> (like today's inventory levels). Use <strong>Fine-Tuning</strong> when you want to teach the AI a new <em>behavior</em> or <em>style</em> (like speaking exactly like a 19th-century pirate, or formatting output as strict JSON code).</p>" },
                    { day: 11, title: "Diffusion Models", concept: "Sculpting from static.", content: "<p>How do AIs like Midjourney or DALL-E create images? They use Diffusion Models. The AI is trained to take an image that is pure digital static (noise) and mathematically reverse the static step-by-step, carving out shapes and colors until a crystal-clear image emerges based on your text prompt.</p>" },
                    { day: 12, title: "Computer Vision", concept: "The digital magnifying glass.", content: "<p>AI 'sees' by sliding a mathematical filter (a convolutional matrix) over an image, pixel by pixel. It detects sharp changes in color to find edges, combines edges to find shapes, and combines shapes to recognize objects—like a stop sign or a human face.</p>" },
                    { day: 13, title: "Voice AI", concept: "Seeing sound.", content: "<p>AI doesn't actually 'hear.' When you speak to an AI, your soundwaves are converted into a visual graph of frequencies called a spectrogram. The AI then uses Computer Vision (from Day 12) to 'read' the picture of your voice and translate it back into text tokens.</p>" },
                    { day: 14, title: "Supervised Fine-Tuning (SFT)", concept: "The apprenticeship.", content: "<p>To make a base AI truly useful, engineers feed it thousands of high-quality examples of a specific task (e.g., 'User asks X, Assistant replies Y'). This supervised training narrows the AI's vast, general knowledge down into a highly specialized expert in a specific domain or brand voice.</p>" }
                ]
            },
            {
                chapterTitle: "Chapter 3: Agents & Modalities",
                chapterDesc: "When AI stops just talking and starts taking action.",
                days: [
                    { day: 15, title: "AI Agents", concept: "The autonomous worker.", content: "<p>A standard LLM just chats. An AI Agent is a system built <em>around</em> an LLM. It can be given a high-level goal, break that goal down into step-by-step tasks, decide which software tools it needs to use, and autonomously execute digital chores without human intervention.</p>" },
                    { day: 16, title: "APIs", concept: "The digital waiters.", content: "<p>For an AI Agent to do real work, it needs to talk to other software. APIs (Application Programming Interfaces) are the menus and waiters of the internet. They allow an AI to place an order (e.g., 'Book a flight to Paris') with another service (like Expedia) in a standardized language both computers understand.</p>" },
                    { day: 17, title: "AI Memory", concept: "Scratchpad vs. Filing Cabinet.", content: "<p>Standard AI chats have a short-term memory (context window); once the chat is cleared, the AI forgets everything. Long-term memory systems solve this by saving your preferences and past conversations into a vector database (RAG), constantly retrieving your background profile to personalize future interactions.</p>" },
                    { day: 18, title: "Multi-Agent Systems", concept: "The digital boardroom.", content: "<p>Why hire one AI when you can hire a team? In multi-agent systems, you assign different personas to different AIs. One AI acts as the Writer, another as the Researcher, and a third as the Critic. They collaborate, debate, and fact-check each other to produce a much higher quality result than a single AI could.</p>" },
                    { day: 19, title: "Multimodal AI", concept: "The unified brain.", content: "<p>Early AI had a separate brain for text, images, and audio. Modern Multimodal AI processes all of these inputs natively in a single neural network. It can look at a live video feed, listen to your voice, and read a document all at the exact same time to connect the dots.</p>" },
                    { day: 20, title: "Robotics & Spatial Intelligence", concept: "Training in the Matrix.", content: "<p>Before an AI is put into a physical metal robot, it must understand gravity, friction, and physics. AI models are trained millions of times inside highly realistic digital simulations. Once the 'brain' masters making a digital robot walk or pick up an object, that knowledge is transferred to a real-world machine.</p>" },
                    { day: 21, title: "AI Ethics & Bias", concept: "The mirror of humanity.", content: "<p>AI is trained on the internet, which means it absorbs all of human history—including our prejudices, biases, and blind spots. If engineers do not actively work to align the model (often using techniques like RLHF - Reinforcement Learning from Human Feedback), the AI will replicate and amplify societal biases.</p>" }
                ]
            },
            {
                chapterTitle: "Chapter 4: The Future Landscape",
                chapterDesc: "The big picture, economics, and what comes next.",
                days: [
                    { day: 22, title: "The Black Box & XAI", concept: "Forcing the math to explain itself.", content: "<p>Deep neural networks have billions of parameters, making them so complex that even their creators don't fully know how they arrive at a specific answer (The Black Box). Explainable AI (XAI) is a growing field dedicated to creating tools that force models to show their work and justify their reasoning.</p>" },
                    { day: 23, title: "Deepfakes & Synthetic Media", concept: "The digital arms race.", content: "<p>Deepfakes are often created using GANs (Generative Adversarial Networks), where two AIs fight each other—one generates fake video/audio, and the other tries to detect the forgery. They improve until the fakes are flawless. Society is now relying on cryptographic watermarks to prove what is real and what is synthetic.</p>" },
                    { day: 24, title: "No-Code AI Agents", concept: "Programming with plain English.", content: "<p>You no longer need to know Python or C++ to build software. Platforms allow anyone to build their own custom AI applications simply by writing a strict, clear English instruction manual and uploading their own reference documents.</p>" },
                    { day: 25, title: "Offensive vs. Defensive AI", concept: "The cyber warfare reality.", content: "<p>The future of cybersecurity is AI versus AI. Hackers use AI to write mutating viruses and conduct massive phishing attacks. In response, corporations use Defensive AI that monitors network traffic 24/7, locking down systems the second it detects behavioral anomalies.</p>" },
                    { day: 26, title: "Edge AI & TinyML", concept: "AI in your pocket.", content: "<p>Currently, most powerful AI runs on massive server farms in the cloud. Edge AI and TinyML focus on shrinking these 'brains' so they can run locally on microchips inside smartphones, smartwatches, and cars. This means instant responses, zero internet requirement, and total data privacy.</p>" },
                    { day: 27, title: "Automation Economics", concept: "The end of linear scaling.", content: "<p>Historically, growing a business meant hiring more people. AI breaks this linear relationship. In the near future, a single senior employee managing a team of specialized AI Agents will be able to accomplish the output of a traditional 50-person department, fundamentally shifting the global economy.</p>" },
                    { day: 28, title: "Smart Cities & Systemic AI", concept: "The unified organism.", content: "<p>As AI scales, it will move beyond chatbots to manage civic infrastructure. Traffic lights, power grids, public transit, and emergency services will be connected into a single, optimized AI organism. While this brings massive efficiency, it requires severe trade-offs regarding surveillance and privacy.</p>" },
                    { day: 29, title: "AGI & ASI", concept: "The endgame.", content: "<p><strong>AGI</strong> (Artificial General Intelligence) is an AI that equals human capability across <em>all</em> economically valuable tasks. <strong>ASI</strong> (Artificial Superintelligence) is the step after, where the AI is vastly smarter, faster, and more creative than the brightest human minds combined.</p>" },
                    { day: 30, title: "The Human Element", concept: "Future-proofing yourself.", content: "<h3>Congratulations!</h3><p>As AI becomes capable of handling all answers and execution, what is left for us? The future belongs to those who provide the right <em>questions</em>, emotional empathy, creative vision, and moral accountability.</p><p>AI is the engine; humanity is the steering wheel. Keep exploring, keep prompting, and keep learning.</p>" }
                ]
            }
        ];

        // Flatten data for easier navigation
        const flatDays = [];
        courseData.forEach((chapter, chapterIndex) => {
            chapter.days.forEach(day => {
                flatDays.push({
                    ...day,
                    chapterTitle: chapter.chapterTitle,
                    chapterIndex: chapterIndex
                });
            });
        });

        // --- 2. APPLICATION STATE ---
        let currentDayIndex = 0;
        let completedDays = [];

        // --- 3. DOM ELEMENTS ---
        const els = {
            sidebar: document.getElementById('sidebar'),
            sidebarOverlay: document.getElementById('sidebar-overlay'),
            mobileMenuBtn: document.getElementById('mobile-menu-btn'),
            closeSidebarBtn: document.getElementById('close-sidebar-btn'),
            nav: document.getElementById('course-nav'),
            
            contentTitle: document.getElementById('content-title'),
            contentBody: document.getElementById('content-body'),
            bcChapter: document.getElementById('bc-chapter'),
            bcDay: document.getElementById('bc-day'),
            
            prevBtn: document.getElementById('prev-btn'),
            nextBtn: document.getElementById('next-btn'),
            markCompleteBtn: document.getElementById('mark-complete-btn'),
            statusBadge: document.getElementById('status-badge'),
            
            progressBar: document.getElementById('progress-bar'),
            progressText: document.getElementById('progress-text'),
            resetBtn: document.getElementById('reset-btn'),

            modal: document.getElementById('reset-modal'),
            modalContent: document.getElementById('reset-modal-content'),
            modalCancel: document.getElementById('modal-cancel-btn'),
            modalConfirm: document.getElementById('modal-confirm-btn')
        };

        // --- 4. CORE FUNCTIONS ---

        function init() {
            loadProgress();
            renderSidebar();
            loadDay(currentDayIndex);
            updateProgressUI();
            setupEventListeners();
        }

        function loadProgress() {
            const savedProgress = localStorage.getItem('ai30DayProgress_v3');
            if (savedProgress) {
                try { completedDays = JSON.parse(savedProgress); } catch(e) { completedDays = []; }
            }
            const savedLastDay = localStorage.getItem('ai30DayLastVisited_v3');
            if (savedLastDay !== null) {
                currentDayIndex = parseInt(savedLastDay, 10);
                if (currentDayIndex >= flatDays.length || currentDayIndex < 0) currentDayIndex = 0;
            }
            if(!Array.isArray(completedDays)) completedDays = [];
        }

        function saveProgress() {
            localStorage.setItem('ai30DayProgress_v3', JSON.stringify(completedDays));
            localStorage.setItem('ai30DayLastVisited_v3', currentDayIndex);
        }

        function renderSidebar() {
            els.nav.innerHTML = '';
            
            courseData.forEach((chapter, chapterIdx) => {
                const chapterEl = document.createElement('div');
                chapterEl.className = 'mb-10';
                
                const chapterHeader = document.createElement('h3');
                chapterHeader.className = 'text-[10px] font-sans font-bold uppercase tracking-[0.2em] text-theme-muted mb-4 ml-1';
                chapterHeader.textContent = chapter.chapterTitle.split(':')[1].trim(); 
                chapterEl.appendChild(chapterHeader);

                const daysList = document.createElement('ul');
                daysList.className = 'space-y-1 relative';

                chapter.days.forEach(day => {
                    const flatIdx = flatDays.findIndex(d => d.day === day.day);
                    const isCompleted = completedDays.includes(day.day);
                    const isActive = flatIdx === currentDayIndex;

                    const li = document.createElement('li');
                    li.className = 'relative group';

                    const btn = document.createElement('button');
                    btn.className = `w-full text-left py-2.5 px-4 transition-all duration-200 text-sm flex items-start gap-3 border-l-2 ${
                        isActive 
                        ? 'border-theme-heading bg-stone-100/50' 
                        : 'border-transparent hover:bg-stone-50 hover:border-stone-300'
                    }`;
                    
                    // Icon / Number logic
                    let leadingElement = '';
                    if (isCompleted) {
                        leadingElement = `<i class="ph ph-check text-stone-500 mt-0.5 text-base shrink-0"></i>`;
                    } else {
                        leadingElement = `<span class="font-serif italic text-stone-400 mt-0.5 text-xs w-4 shrink-0 text-center">${day.day}</span>`;
                    }

                    btn.innerHTML = `
                        ${leadingElement}
                        <div>
                            <span class="block font-serif ${isActive ? 'text-theme-heading font-semibold' : 'text-theme-text group-hover:text-theme-heading'} mb-0.5">${day.title}</span>
                        </div>
                    `;
                    
                    btn.onclick = () => {
                        loadDay(flatIdx);
                        closeSidebar();
                    };

                    li.appendChild(btn);
                    daysList.appendChild(li);
                });

                chapterEl.appendChild(daysList);
                els.nav.appendChild(chapterEl);
            });
        }

        function loadDay(index) {
            currentDayIndex = index;
            const dayData = flatDays[index];
            const isCompleted = completedDays.includes(dayData.day);

            // Re-trigger animations
            const fadeElements = document.querySelectorAll('.fade-in');
            fadeElements.forEach(el => {
                el.classList.remove('fade-in');
                void el.offsetWidth; // trigger reflow
                el.classList.add('fade-in');
            });

            // Update UI Text
            els.bcChapter.textContent = dayData.chapterTitle;
            els.bcDay.textContent = `Day ${dayData.day}`;
            els.contentTitle.textContent = dayData.title;
            
            // Build Content HTML (Editorial Callout)
            let contentHTML = `
                <div class="border-l-[3px] border-stone-800 bg-stone-50 p-6 sm:p-8 mb-10 font-serif italic text-stone-700 relative">
                    <p class="m-0 text-lg leading-relaxed"><span class="block text-[10px] font-sans font-bold uppercase tracking-widest text-stone-400 mb-3 not-italic">Core Concept</span> ${dayData.concept}</p>
                </div>
                ${dayData.content}
            `;
            els.contentBody.innerHTML = contentHTML;

            // Update Button States
            els.prevBtn.disabled = currentDayIndex === 0;
            els.nextBtn.disabled = currentDayIndex === flatDays.length - 1;

            updateCompletionUI(isCompleted);
            renderSidebar(); 
            saveProgress();
            
            // Scroll to top
            els.mainContent = document.getElementById('main-content');
            if(els.mainContent) els.mainContent.scrollTop = 0;
        }

        function toggleCompletion() {
            const currentDayNum = flatDays[currentDayIndex].day;
            const idx = completedDays.indexOf(currentDayNum);
            
            if (idx === -1) {
                // Mark complete
                completedDays.push(currentDayNum);
                updateCompletionUI(true);
                
                // Auto-advance
                if (currentDayIndex < flatDays.length - 1) {
                    setTimeout(() => {
                        loadDay(currentDayIndex + 1);
                    }, 500);
                }
            } else {
                // Unmark
                completedDays.splice(idx, 1);
                updateCompletionUI(false);
            }
            
            updateProgressUI();
            renderSidebar();
            saveProgress();
        }

        function updateCompletionUI(isCompleted) {
            if (isCompleted) {
                els.statusBadge.classList.remove('hidden');
                els.markCompleteBtn.innerHTML = '<i class="ph-fill ph-check-circle text-lg text-stone-500"></i><span>Completed</span>';
                els.markCompleteBtn.className = "w-full sm:w-auto px-8 py-4 bg-stone-100 border border-stone-200 text-stone-800 font-sans font-bold uppercase tracking-widest text-xs transition-all flex items-center justify-center gap-3";
            } else {
                els.statusBadge.classList.add('hidden');
                els.markCompleteBtn.innerHTML = '<i class="ph ph-circle text-lg text-theme-muted group-hover:text-theme-heading transition-colors"></i><span>Mark as Complete</span>';
                els.markCompleteBtn.className = "w-full sm:w-auto px-8 py-4 border border-theme-heading text-theme-heading font-sans font-bold uppercase tracking-widest text-xs hover:bg-stone-50 transition-colors flex items-center justify-center gap-3 group";
            }
        }

        function updateProgressUI() {
            const total = flatDays.length;
            const completed = completedDays.length;
            const percentage = Math.round((completed / total) * 100);
            
            els.progressBar.style.width = `${percentage}%`;
            els.progressText.textContent = `${percentage}%`;
        }

        // Mobile Sidebar Controls
        function openSidebar() {
            els.sidebar.classList.remove('-translate-x-full');
            els.sidebarOverlay.classList.remove('hidden');
            setTimeout(() => els.sidebarOverlay.classList.remove('opacity-0'), 10);
        }

        function closeSidebar() {
            els.sidebar.classList.add('-translate-x-full');
            els.sidebarOverlay.classList.add('opacity-0');
            setTimeout(() => els.sidebarOverlay.classList.add('hidden'), 300);
        }

        // Custom Modal Controls
        function openModal() {
            els.modal.classList.remove('pointer-events-none', 'opacity-0');
            els.modalContent.classList.remove('scale-95');
            els.modalContent.classList.add('scale-100');
        }

        function closeModal() {
            els.modal.classList.add('pointer-events-none', 'opacity-0');
            els.modalContent.classList.remove('scale-100');
            els.modalContent.classList.add('scale-95');
        }

        function handleReset() {
            completedDays = [];
            currentDayIndex = 0;
            saveProgress();
            closeModal();
            init();
        }

        function setupEventListeners() {
            els.prevBtn.addEventListener('click', () => {
                if (currentDayIndex > 0) loadDay(currentDayIndex - 1);
            });

            els.nextBtn.addEventListener('click', () => {
                if (currentDayIndex < flatDays.length - 1) loadDay(currentDayIndex + 1);
            });

            els.markCompleteBtn.addEventListener('click', toggleCompletion);

            // Modal Events
            els.resetBtn.addEventListener('click', openModal);
            els.modalCancel.addEventListener('click', closeModal);
            els.modalConfirm.addEventListener('click', handleReset);
            els.modal.addEventListener('click', (e) => {
                if(e.target === els.modal) closeModal();
            });

            // Mobile sidebar events
            els.mobileMenuBtn.addEventListener('click', openSidebar);
            els.closeSidebarBtn.addEventListener('click', closeSidebar);
            els.sidebarOverlay.addEventListener('click', closeSidebar);
        }

        // Boot the app
        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
